Name: user-service
GRPC:
  Address: 0.0.0.0:9001
  Timeout: 3s
SensitiveMethods:
  - /user.v1.UserService/Login
  - /user.v1.UserService/PrepareLogin
  - /user.v1.UserService/VerifyLogin2FA
