  - /user.v1.UserService/RegenerateRecoveryCodes
  - /user.v1.UserService/FinishPasskeyRegistration
  - /user.v1.UserService/FinishPasskeyLogin
  - /user.v1.UserService/Refresh
  - /user.v1.UserService/Logout
