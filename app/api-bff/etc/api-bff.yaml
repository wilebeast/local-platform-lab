Name: api-bff
Host: 0.0.0.0
Port: 8888
Timeout: 3000
Mode: dev
UserRpc:
  Target: dns:///user-service.user-service.svc.cluster.local:9001
  Provider: nacos
  ServiceName: user-service
  NacosAddress: nacos.nacos.svc.cluster.local:8848
  EtcdEndpoints: etcd-client.etcd.svc.cluster.local:2379
GenericRPC:
  ReloadInterval: 10s
  Schemas:
    - Name: user-v1
      Service: user-service
      Schema: user.v1.UserService
      Version: 1.0.0
      DescriptorPath: /etc/api-bff/schemas/user-service-v1.pb
      MetadataPath: /etc/api-bff/schemas/user-service-v1.yaml
      DescriptorSHA256: e8183a0d29943b4c49153a4c9c1068dfe9f45f59b953f94ffb7657982c8b1458
      Target: dns:///user-service.user-service.svc.cluster.local:9001
      Provider: nacos
      NacosAddress: nacos.nacos.svc.cluster.local:8848
      EtcdEndpoints: etcd-client.etcd.svc.cluster.local:2379
    - Name: account-v1
      Service: account-service
      Schema: account.v1.AccountService
      Version: 1.0.0
      DescriptorPath: /etc/api-bff/schemas/account-service-v1.pb
      MetadataPath: /etc/api-bff/schemas/account-service-v1.yaml
      DescriptorSHA256: cb4db4967febb44c0d7217183e9d54fbbc70e2c3786c5a6fbffbd1cb54950623
      Target: dns:///account-service.account-service.svc.cluster.local:9002
      Provider: nacos
      NacosAddress: nacos.nacos.svc.cluster.local:8848
      EtcdEndpoints: etcd-client.etcd.svc.cluster.local:2379
  Routes:
    - Name: get-profile
      SchemaRef: user-v1
      Method: /user.v1.UserService/GetProfile
      Timeout: 2s
      InputFields:
        - ProtoName: user_id
          JSONName: userId
          Kind: string
          Repeated: false
      OutputFields:
        - ProtoName: user_id
          JSONName: userId
          Kind: string
          Repeated: false
        - ProtoName: verification_status
          JSONName: verificationStatus
          Kind: string
          Repeated: false
    - Name: get-account-summary
      SchemaRef: account-v1
      Method: /account.v1.AccountService/GetSummary
      Timeout: 2s
      InputFields:
        - {ProtoName: user_id, JSONName: userId, Kind: string, Repeated: false}
      OutputFields:
        - {ProtoName: account_id, JSONName: accountId, Kind: string, Repeated: false}
        - {ProtoName: status, JSONName: status, Kind: string, Repeated: false}
    - Name: get-account-limits
      SchemaRef: account-v1
      Method: /account.v1.AccountService/GetLimits
      Timeout: 2s
      InputFields:
        - {ProtoName: user_id, JSONName: userId, Kind: string, Repeated: false}
      OutputFields:
        - {ProtoName: daily_limit_cents, JSONName: dailyLimitCents, Kind: int64, Repeated: false}
        - {ProtoName: currency, JSONName: currency, Kind: string, Repeated: false}
