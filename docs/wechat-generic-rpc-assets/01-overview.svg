<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#12263d"/></linearGradient>
    <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#2d8cff"/><stop offset="1" stop-color="#1358c8"/></linearGradient>
    <linearGradient id="green" x2="0" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#0d8d68"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6fb6ff"/></marker>
    <style>
      .title{font:700 34px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#f8fbff}.sub{font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#9bb4ce}.box{stroke:#53718f;stroke-width:1.5;filter:url(#shadow)}.h{font:700 19px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#fff}.p{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#d8e6f4}.tag{font:700 12px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;fill:#06111d}.arrow{stroke:#6fb6ff;stroke-width:3;fill:none;marker-end:url(#arrow)}.tiny{font:12px ui-monospace,SFMono-Regular,monospace;fill:#9fd0ff}
    </style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" class="title">双服务泛化调用：一条请求的完整旅程</text>
  <text x="60" y="94" class="sub">外部保持 HTTP/JSON，BFF 内部按白名单路由动态调用 gRPC</text>

  <g transform="translate(54 176)"><rect width="150" height="190" rx="18" fill="#142b42" class="box"/><rect x="18" y="22" width="114" height="70" rx="10" fill="#071522" stroke="#6887a5"/><circle cx="75" cy="116" r="14" fill="#6fb6ff"/><rect x="45" y="136" width="60" height="28" rx="14" fill="#223e58"/><text x="75" y="188" text-anchor="middle" class="h">HTTP Client</text><text x="75" y="215" text-anchor="middle" class="tiny">Cookie / Bearer</text></g>
  <g transform="translate(250 176)"><rect width="155" height="190" rx="18" fill="#142b42" class="box"/><path d="M30 62h95M30 84h95M30 106h95" stroke="#7ebeff" stroke-width="7" stroke-linecap="round"/><text x="78" y="146" text-anchor="middle" class="h">ALB + APISIX</text><text x="78" y="170" text-anchor="middle" class="p">TLS、鉴权、限流</text></g>
  <g transform="translate(453 145)"><rect width="245" height="252" rx="20" fill="url(#blue)" class="box"/><g transform="translate(25 28)"><rect width="195" height="52" rx="10" fill="#071a34" opacity=".7"/><text x="98" y="32" text-anchor="middle" class="h">Go-Zero API BFF</text></g><g transform="translate(25 97)"><rect width="195" height="42" rx="9" fill="#cbe6ff"/><text x="98" y="27" text-anchor="middle" class="tag">Route Registry</text></g><g transform="translate(25 151)"><rect width="92" height="54" rx="9" fill="#e9f5ff"/><text x="46" y="23" text-anchor="middle" class="tag">user-v1</text><text x="46" y="41" text-anchor="middle" class="tag">Invoker</text><rect x="103" width="92" height="54" rx="9" fill="#d7fff1"/><text x="149" y="23" text-anchor="middle" class="tag">account-v1</text><text x="149" y="41" text-anchor="middle" class="tag">Invoker</text></g></g>
  <g transform="translate(762 130)"><rect width="184" height="155" rx="18" fill="url(#green)" class="box"/><circle cx="48" cy="56" r="24" fill="#072b23"/><path d="M39 55h18M48 46v18" stroke="#baffea" stroke-width="5"/><text x="92" y="110" text-anchor="middle" class="h">user-service</text><text x="92" y="134" text-anchor="middle" class="p">GetProfile</text></g>
  <g transform="translate(762 325)"><rect width="184" height="177" rx="18" fill="#7c4dff" class="box"/><rect x="31" y="31" width="122" height="54" rx="9" fill="#1d1245"/><path d="M50 51h84M50 67h58" stroke="#d9ccff" stroke-width="5" stroke-linecap="round"/><text x="92" y="122" text-anchor="middle" class="h">account-service</text><text x="92" y="146" text-anchor="middle" class="p">GetSummary</text><text x="92" y="166" text-anchor="middle" class="p">GetLimits</text></g>
  <g transform="translate(995 206)"><rect width="152" height="220" rx="18" fill="#142b42" class="box"/><ellipse cx="76" cy="48" rx="45" ry="18" fill="#ffc857"/><path d="M31 48v88c0 10 20 18 45 18s45-8 45-18V48" fill="#aa6b00"/><ellipse cx="76" cy="136" rx="45" ry="18" fill="#d98b00"/><text x="76" y="190" text-anchor="middle" class="h">Nacos / Etcd</text><text x="76" y="214" text-anchor="middle" class="p">服务发现</text></g>

  <path d="M204 270H244" class="arrow"/><path d="M405 270H447" class="arrow"/><path d="M698 225C730 225 730 207 756 207" class="arrow"/><path d="M698 318C730 318 730 413 756 413" class="arrow"/><path d="M946 207C975 207 970 260 990 260" class="arrow"/><path d="M946 413C975 413 970 370 990 370" class="arrow"/>
  <g transform="translate(60 555)"><rect width="1080" height="68" rx="14" fill="#071522" stroke="#2c4b68"/><text x="28" y="28" class="tiny">HTTP/JSON</text><text x="155" y="28" class="p">→</text><text x="195" y="28" class="tiny">APISIX可信身份头 + HMAC</text><text x="445" y="28" class="p">→</text><text x="485" y="28" class="tiny">dynamicpb + ClientConn.Invoke</text><text x="780" y="28" class="p">→</text><text x="820" y="28" class="tiny">gRPC/Protobuf</text><text x="28" y="52" class="sub">客户端不能指定服务和方法；只允许调用 BFF 配置中的稳定路由名。</text></g>
</svg>
