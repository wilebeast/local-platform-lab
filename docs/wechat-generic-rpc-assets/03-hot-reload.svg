<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#08121e"/><stop offset="1" stop-color="#1c2638"/></linearGradient><filter id="sh"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".35"/></filter><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#78b8ff"/></marker><style>.t{font:700 34px -apple-system,"PingFang SC",sans-serif;fill:#fff}.st{font:16px -apple-system,"PingFang SC",sans-serif;fill:#a9bfd3}.h{font:700 17px -apple-system,"PingFang SC",sans-serif;fill:#fff}.p{font:14px -apple-system,"PingFang SC",sans-serif;fill:#d1e1ef}.n{font:700 14px -apple-system,"PingFang SC",sans-serif;fill:#07111d}.ok{font:700 14px -apple-system,"PingFang SC",sans-serif;fill:#7ff0bd}.bad{font:700 14px -apple-system,"PingFang SC",sans-serif;fill:#ff9b9b}.ln{stroke:#78b8ff;stroke-width:3;fill:none;marker-end:url(#ar)}</style></defs>
  <rect width="1200" height="675" rx="28" fill="url(#b)"/><text x="58" y="62" class="t">Descriptor 热更新：先验货，再切换</text><text x="58" y="93" class="st">新版本只有通过全部安全闸，才会原子替换内存快照；失败时旧版本继续服务</text>
  <g transform="translate(54 160)" filter="url(#sh)"><rect width="185" height="270" rx="18" fill="#17324a" stroke="#476b87"/><path d="M52 37h82l20 20v118H32V37z" fill="#e9f3ff"/><path d="M134 37v22h20" fill="none" stroke="#6d88a0"/><text x="93" y="102" text-anchor="middle" class="n">Descriptor.pb</text><text x="93" y="132" text-anchor="middle" class="n">metadata.yaml</text><text x="93" y="222" text-anchor="middle" class="h">GitOps ConfigMap</text><text x="93" y="247" text-anchor="middle" class="p">Kubernetes 投影</text></g>
  <g transform="translate(300 135)" filter="url(#sh)"><rect width="470" height="320" rx="20" fill="#12283b" stroke="#527592"/><text x="235" y="38" text-anchor="middle" class="h">BFF Reload Pipeline（每 10 秒检查）</text><g transform="translate(28 66)"><rect width="185" height="48" rx="10" fill="#d9ebff"/><text x="92" y="30" text-anchor="middle" class="n">1. metadata 身份与版本</text><rect x="228" width="185" height="48" rx="10" fill="#d9ebff"/><text x="320" y="30" text-anchor="middle" class="n">2. SHA-256 摘要</text><rect y="72" width="185" height="48" rx="10" fill="#d9ebff"/><text x="92" y="102" text-anchor="middle" class="n">3. Descriptor 可解析</text><rect x="228" y="72" width="185" height="48" rx="10" fill="#d9ebff"/><text x="320" y="102" text-anchor="middle" class="n">4. Unary RPC 白名单</text><rect y="144" width="185" height="48" rx="10" fill="#d9ebff"/><text x="92" y="174" text-anchor="middle" class="n">5. 字段名 / JSON 名</text><rect x="228" y="144" width="185" height="48" rx="10" fill="#d9ebff"/><text x="320" y="174" text-anchor="middle" class="n">6. Kind / repeated</text></g><rect x="129" y="274" width="212" height="34" rx="17" fill="#36d399"/><text x="235" y="296" text-anchor="middle" class="n">atomic.Pointer.Store(new)</text></g>
  <g transform="translate(840 135)" filter="url(#sh)"><rect width="300" height="150" rx="18" fill="#11392f" stroke="#37a67d"/><circle cx="42" cy="42" r="21" fill="#36d399"/><path d="M31 42l8 8 15-19" fill="none" stroke="#062219" stroke-width="5"/><text x="78" y="47" class="h">全部通过</text><text x="28" y="88" class="ok">原子切换到新快照</text><text x="28" y="116" class="p">新请求使用新版，进行中请求不受影响</text></g>
  <g transform="translate(840 330)" filter="url(#sh)"><rect width="300" height="150" rx="18" fill="#42242a" stroke="#c75d6d"/><circle cx="42" cy="42" r="21" fill="#ff737f"/><path d="M32 32l20 20M52 32L32 52" stroke="#351017" stroke-width="5"/><text x="78" y="47" class="h">任一失败</text><text x="28" y="88" class="bad">拒绝更新并记录原因</text><text x="28" y="116" class="p">旧快照继续响应，业务不中断</text></g>
  <path d="M239 294h55" class="ln"/><path d="M770 266c35 0 32-55 64-55" class="ln"/><path d="M770 328c35 0 32 77 64 77" class="ln"/>
  <g transform="translate(55 535)"><rect width="1085" height="88" rx="14" fill="#07111d" stroke="#38546d"/><text x="24" y="31" class="ok">真实演练：兼容更新成功，Pod UID 不变</text><text x="24" y="59" class="bad">错误 digest：expected 0000…，got cb4d… → 更新被拒绝，旧接口仍返回 200</text><text x="760" y="59" class="st">最后由 Argo CD 恢复正确状态</text></g>
</svg>
