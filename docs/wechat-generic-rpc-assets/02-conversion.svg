<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs><linearGradient id="bg2" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#e8f2ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16324f" flood-opacity=".16"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2d78d0"/></marker><style>.t{font:700 34px -apple-system,"PingFang SC",sans-serif;fill:#102a43}.st{font:16px -apple-system,"PingFang SC",sans-serif;fill:#526d82}.h{font:700 19px -apple-system,"PingFang SC",sans-serif;fill:#102a43}.p{font:14px -apple-system,"PingFang SC",sans-serif;fill:#486581}.code{font:14px ui-monospace,SFMono-Regular,monospace;fill:#e6f3ff}.num{font:700 15px -apple-system,"PingFang SC",sans-serif;fill:white}.ln{stroke:#2d78d0;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg2)"/>
  <text x="56" y="65" class="t">HTTP JSON 到 gRPC：不是“字符串替换”，而是动态消息构造</text><text x="56" y="96" class="st">Descriptor 提供运行时类型系统，dynamicpb 根据字段描述生成真实 Protobuf Message</text>
  <g transform="translate(55 155)" filter="url(#s)"><rect width="235" height="330" rx="18" fill="#102a43"/><circle cx="28" cy="30" r="15" fill="#2d78d0"/><text x="28" y="35" text-anchor="middle" class="num">1</text><text x="52" y="36" class="code">HTTP JSON</text><path d="M22 62h191" stroke="#36566f"/><text x="22" y="98" class="code">{</text><text x="35" y="126" class="code">"userId":</text><text x="126" y="126" class="code">"local-user"</text><text x="22" y="154" class="code">}</text><text x="22" y="212" class="p" fill="#a9c5da">普通 JSON 对象</text><text x="22" y="238" class="p" fill="#a9c5da">还没有 Protobuf 类型</text></g>
  <g transform="translate(345 155)" filter="url(#s)"><rect width="235" height="330" rx="18" fill="white" stroke="#bdd3e8"/><circle cx="28" cy="30" r="15" fill="#2d78d0"/><text x="28" y="35" text-anchor="middle" class="num">2</text><text x="52" y="36" class="h">查 Descriptor</text><g transform="translate(25 72)"><rect width="185" height="44" rx="8" fill="#e7f1ff"/><text x="14" y="27" class="p">MethodDescriptor</text><rect y="58" width="185" height="44" rx="8" fill="#e7f1ff"/><text x="14" y="85" class="p">Input Message</text><rect y="116" width="185" height="44" rx="8" fill="#e7f1ff"/><text x="14" y="143" class="p">Field: user_id</text><rect y="174" width="185" height="44" rx="8" fill="#e7f1ff"/><text x="14" y="201" class="p">Kind: string</text></g><text x="25" y="316" class="st">白名单方法 + 字段合约</text></g>
  <g transform="translate(635 155)" filter="url(#s)"><rect width="235" height="330" rx="18" fill="white" stroke="#b8dcca"/><circle cx="28" cy="30" r="15" fill="#10a36f"/><text x="28" y="35" text-anchor="middle" class="num">3</text><text x="52" y="36" class="h">构造 dynamicpb</text><g transform="translate(38 83)"><path d="M0 20L80 0l80 20v118l-80 22-80-22z" fill="#d7f8e9" stroke="#34a77d" stroke-width="2"/><path d="M0 20l80 22 80-22M80 42v118" fill="none" stroke="#34a77d" stroke-width="2"/><text x="80" y="82" text-anchor="middle" class="h">Message</text><text x="80" y="108" text-anchor="middle" class="p">user_id</text><text x="80" y="130" text-anchor="middle" class="p">local-user</text></g><text x="25" y="316" class="st">protojson.Unmarshal</text></g>
  <g transform="translate(925 155)" filter="url(#s)"><rect width="220" height="330" rx="18" fill="#102a43"/><circle cx="28" cy="30" r="15" fill="#7c4dff"/><text x="28" y="35" text-anchor="middle" class="num">4</text><text x="52" y="36" class="code">gRPC Invoke</text><text x="18" y="92" class="code">conn.Invoke(</text><text x="30" y="120" class="code">ctx,</text><text x="30" y="148" class="code">"/account.v1.</text><text x="30" y="176" class="code">AccountService/</text><text x="30" y="204" class="code">GetSummary",</text><text x="30" y="232" class="code">request,</text><text x="30" y="260" class="code">response)</text><text x="18" y="312" class="p" fill="#a9c5da">HTTP/2 + Protobuf</text></g>
  <path d="M290 320h49" class="ln"/><path d="M580 320h49" class="ln"/><path d="M870 320h49" class="ln"/>
  <g transform="translate(56 535)"><rect width="1088" height="88" rx="14" fill="#fff" stroke="#bdd3e8"/><text x="24" y="32" class="h">回包方向完全相反</text><text x="24" y="60" class="st">动态 Response Message → protojson.Marshal → map[string]any → Handler 业务裁剪 → HTTP JSON</text><text x="795" y="60" class="st">类型不匹配立即失败，不静默猜测</text></g>
</svg>
