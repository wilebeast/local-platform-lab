<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" rx="28" fill="#f7f9fc"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="60" y="62" font-size="30" font-weight="700" fill="#172033">启用 TOTP 后的两阶段登录</text>
    <text x="60" y="94" font-size="17" fill="#66758a">Token 只会在密码与第二因素都通过后签发</text>
    <g font-size="19" font-weight="650" text-anchor="middle" fill="#263244">
      <rect x="50" y="125" width="170" height="56" rx="13" fill="#e5ebf4" stroke="#94a3b8"/><text x="135" y="160">浏览器</text>
      <rect x="275" y="125" width="170" height="56" rx="13" fill="#e5ebf4" stroke="#94a3b8"/><text x="360" y="160">APISIX</text>
      <rect x="500" y="125" width="170" height="56" rx="13" fill="#e5ebf4" stroke="#94a3b8"/><text x="585" y="160">API BFF</text>
      <rect x="725" y="125" width="190" height="56" rx="13" fill="#e5ebf4" stroke="#94a3b8"/><text x="820" y="160">user-service</text>
      <rect x="970" y="125" width="170" height="56" rx="13" fill="#e5ebf4" stroke="#94a3b8"/><text x="1055" y="160">Redis</text>
    </g>
    <g stroke="#a7b2c2" stroke-width="2" stroke-dasharray="7 7"><path d="M135 181v510"/><path d="M360 181v510"/><path d="M585 181v510"/><path d="M820 181v510"/><path d="M1055 181v510"/></g>
    <g fill="none" stroke="#4f7cff" stroke-width="3" marker-end="url(#arrow)">
      <path d="M135 225H350"/><path d="M360 275H575"/><path d="M585 325H810"/><path d="M820 375H1045"/>
      <path d="M1045 420H830"/><path d="M810 465H595"/><path d="M575 510H145"/>
      <path d="M135 565H350"/><path d="M360 610H810"/><path d="M820 655H1045"/>
    </g>
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#4f7cff"/></marker></defs>
    <g font-size="16" fill="#263244">
      <text x="180" y="216">① 邮箱 + 密码</text>
      <text x="398" y="266">限流、清除伪造身份头</text>
      <text x="630" y="316">gRPC PrepareLogin</text>
      <text x="865" y="366">查询加密 TOTP Secret</text>
      <text x="860" y="411">账户已绑定 TOTP</text>
      <text x="625" y="456">创建 5 分钟一次性挑战</text>
      <text x="235" y="501">② 返回 authSessionToken，不返回 Access Token</text>
      <text x="170" y="556">③ 挑战 Token + 六位码</text>
      <text x="485" y="601">④ gRPC VerifyLogin2FA</text>
      <text x="855" y="646">原子消费挑战并验证动态码</text>
    </g>
    <g transform="translate(250 698)">
      <rect width="700" height="44" rx="22" fill="#172033"/>
      <text x="350" y="29" text-anchor="middle" font-size="17" font-weight="650" fill="#fff">验证成功 → 签发 Access Token + Refresh Token → BFF 写入安全 Cookie</text>
    </g>
  </g>
</svg>
