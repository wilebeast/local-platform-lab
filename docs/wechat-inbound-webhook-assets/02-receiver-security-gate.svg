<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#edf4fb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity=".14"/></filter><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="55" y="68" font-family="PingFang SC,sans-serif" font-size="34" font-weight="700" fill="#10233f">Receiver 安全准入流水线</text><text x="55" y="104" font-family="PingFang SC,sans-serif" font-size="17" fill="#60748c">先验证来源与原始字节，再允许事件进入可信 Inbox</text>
  <g font-family="PingFang SC,sans-serif" filter="url(#s)">
    <g><rect x="50" y="205" width="160" height="190" rx="20" fill="#fff" stroke="#8ba5bf" stroke-width="2"/><text x="83" y="250" font-size="21" font-weight="700" fill="#17345e">HTTP 请求</text><text x="76" y="290" font-size="15" fill="#536f8b">Headers</text><text x="76" y="320" font-size="15" fill="#536f8b">Raw Body</text><text x="76" y="350" font-size="15" fill="#536f8b">Signature</text></g>
    <g><rect x="270" y="205" width="160" height="190" rx="20" fill="#e8f1ff" stroke="#6294dd" stroke-width="2"/><text x="302" y="250" font-size="20" font-weight="700" fill="#184e8e">可信路由</text><text x="295" y="292" font-size="15" fill="#406b99">选择 Integration</text><text x="291" y="325" font-size="15" fill="#406b99">选择 Adapter</text><text x="298" y="358" font-size="15" fill="#406b99">选择 key_id</text></g>
    <g><rect x="490" y="205" width="160" height="190" rx="20" fill="#fff4dc" stroke="#d8a23e" stroke-width="2"/><text x="521" y="250" font-size="20" font-weight="700" fill="#835d13">安全校验</text><text x="518" y="292" font-size="15" fill="#8c6d2c">时间戳窗口</text><text x="514" y="325" font-size="15" fill="#8c6d2c">原始字节验签</text><text x="518" y="358" font-size="15" fill="#8c6d2c">事件 ID 绑定</text></g>
    <g><rect x="710" y="205" width="160" height="190" rx="20" fill="#efeaff" stroke="#8974d5" stroke-width="2"/><text x="744" y="250" font-size="20" font-weight="700" fill="#4d3b99">事件准入</text><text x="735" y="292" font-size="15" fill="#6759a0">解析 JSON</text><text x="733" y="325" font-size="15" fill="#6759a0">校验 Schema</text><text x="727" y="358" font-size="15" fill="#6759a0">核对事件前缀</text></g>
    <g><rect x="930" y="205" width="210" height="190" rx="20" fill="#e9f7f1" stroke="#47a477" stroke-width="2"/><text x="971" y="250" font-size="20" font-weight="700" fill="#145e43">Inbox 幂等落库</text><text x="962" y="292" font-size="15" fill="#39765e">唯一键去重</text><text x="962" y="325" font-size="15" fill="#39765e">保存原始证据</text><text x="962" y="358" font-size="15" fill="#39765e">返回 HTTP 200</text></g>
  </g>
  <g stroke="#2563eb" stroke-width="5" marker-end="url(#a)"><path d="M210 300H270"/><path d="M430 300H490"/><path d="M650 300H710"/><path d="M870 300H930"/></g>
  <path d="M570 395V500H905" fill="none" stroke="#d54c4c" stroke-width="4" marker-end="url(#a)"/><rect x="910" y="462" width="230" height="78" rx="15" fill="#fff0f0" stroke="#d54c4c" stroke-width="2"/><text x="952" y="495" font-family="PingFang SC" font-size="18" font-weight="700" fill="#9c3030">失败：401 / 400</text><text x="946" y="521" font-family="PingFang SC" font-size="14" fill="#aa5656">不写 Inbox · 不触发 Worker</text>
  <text x="55" y="625" font-family="PingFang SC,sans-serif" font-size="17" fill="#49637e">签名原文：timestamp + "." + event_id + "." + raw_body</text>
</svg>
