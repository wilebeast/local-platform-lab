<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="55" y="68" font-family="PingFang SC,sans-serif" font-size="34" font-weight="700" fill="#10233f">Ed25519 密钥不停机轮换</text><text x="55" y="104" font-family="PingFang SC,sans-serif" font-size="17" fill="#60748c">新增 → 并存 → 切流 → 退役 → 销毁</text>
  <path d="M120 345H1085" stroke="#9fb2c6" stroke-width="7" marker-end="url(#a)"/><g fill="#2563eb"><circle cx="170" cy="345" r="17"/><circle cx="470" cy="345" r="17"/><circle cx="770" cy="345" r="17"/><circle cx="1040" cy="345" r="17"/></g>
  <g font-family="PingFang SC,sans-serif" filter="url(#s)">
    <rect x="65" y="155" width="210" height="135" rx="20" fill="#fff" stroke="#729fdc" stroke-width="2"/><text x="104" y="195" font-size="21" font-weight="700" fill="#17345e">阶段 1 · 仅 v1</text><text x="100" y="235" font-size="16" fill="#4f6b89">card-v1 → 200</text><text x="100" y="263" font-size="16" fill="#9a5555">card-v2 → 不可用</text>
    <rect x="350" y="395" width="240" height="155" rx="20" fill="#fff" stroke="#8977d6" stroke-width="2"/><text x="391" y="437" font-size="21" font-weight="700" fill="#4b3c92">阶段 2 · 双 Key</text><text x="389" y="477" font-size="16" fill="#63579b">v1 公钥 + v2 公钥</text><text x="389" y="507" font-size="16" fill="#32745c">v1 → 200 · v2 → 200</text>
    <rect x="650" y="155" width="240" height="135" rx="20" fill="#fff" stroke="#48a579" stroke-width="2"/><text x="691" y="195" font-size="21" font-weight="700" fill="#145e43">阶段 3 · 切流</text><text x="688" y="235" font-size="16" fill="#3c7a61">新实例改用 card-v2</text><text x="688" y="263" font-size="16" fill="#557188">观察成功率与错误率</text>
    <rect x="920" y="395" width="240" height="155" rx="20" fill="#fff" stroke="#d06363" stroke-width="2"/><text x="958" y="437" font-size="21" font-weight="700" fill="#963636">阶段 4 · 退役 v1</text><text x="958" y="477" font-size="16" fill="#9b5555">活动 Keyring 仅 v2</text><text x="958" y="507" font-size="16" fill="#32745c">v1 → 401 · v2 → 200</text>
  </g>
  <g font-family="PingFang SC,sans-serif" font-size="14" fill="#60748c"><text x="133" y="375">生成 v2</text><text x="423" y="375">并存窗口</text><text x="733" y="375">完成迁移</text><text x="995" y="375">观察后销毁</text></g>
  <rect x="65" y="595" width="1095" height="2" fill="#cad6e3"/><text x="65" y="635" font-family="PingFang SC,sans-serif" font-size="16" fill="#526d88">Key ID 只是公钥选择器；真正的签名能力始终只属于持有对应私钥的一方</text>
</svg>
