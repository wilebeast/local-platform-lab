<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#edf3fa"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".14"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#376da8"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg)"/><text x="55" y="68" font-family="PingFang SC,sans-serif" font-size="34" font-weight="700" fill="#10233f">PostgreSQL Inbox 状态机</text><text x="55" y="104" font-family="PingFang SC,sans-serif" font-size="17" fill="#60748c">可靠接收、并发领取、退避重试与死信留痕</text>
  <g filter="url(#s)" font-family="PingFang SC,sans-serif">
    <rect x="70" y="260" width="190" height="120" rx="24" fill="#e8f1ff" stroke="#6092d8" stroke-width="3"/><text x="114" y="315" font-size="25" font-weight="700" fill="#174f8d">pending</text><text x="102" y="349" font-size="14" fill="#49709b">已落库，等待领取</text>
    <rect x="350" y="260" width="190" height="120" rx="24" fill="#fff4dc" stroke="#d9a43e" stroke-width="3"/><text x="386" y="315" font-size="25" font-weight="700" fill="#805b13">processing</text><text x="379" y="349" font-size="14" fill="#8a6b2b">Worker 已锁定</text>
    <rect x="690" y="145" width="190" height="120" rx="24" fill="#e9f7f1" stroke="#43a274" stroke-width="3"/><text x="731" y="200" font-size="25" font-weight="700" fill="#145e43">processed</text><text x="724" y="234" font-size="14" fill="#3f7861">投影成功，处理完成</text>
    <rect x="690" y="375" width="190" height="120" rx="24" fill="#efeaff" stroke="#8874d4" stroke-width="3"/><text x="751" y="430" font-size="25" font-weight="700" fill="#4f3e98">retry</text><text x="722" y="464" font-size="14" fill="#6a5ca1">等待 next_attempt_at</text>
    <rect x="970" y="375" width="190" height="120" rx="24" fill="#fff0f0" stroke="#d35858" stroke-width="3"/><text x="1003" y="430" font-size="24" font-weight="700" fill="#943333">dead_letter</text><text x="1001" y="464" font-size="14" fill="#a85858">超过重试上限</text>
  </g>
  <g fill="none" stroke="#376da8" stroke-width="5" marker-end="url(#a)"><path d="M260 320H350"/><path d="M540 295C610 295 620 205 690 205"/><path d="M540 345C610 345 620 435 690 435"/><path d="M690 460H610C570 460 570 380 610 380H690"/><path d="M880 435H970"/></g>
  <g font-family="PingFang SC,sans-serif" font-size="14" fill="#526d88"><text x="280" y="304">SKIP LOCKED</text><text x="591" y="238">成功</text><text x="590" y="414">失败</text><text x="575" y="510">退避后再次领取</text><text x="902" y="418">第 3 次失败</text></g>
  <rect x="70" y="540" width="1090" height="72" rx="16" fill="#17283f"/><text x="101" y="571" font-family="PingFang SC" font-size="16" font-weight="700" fill="#fff">崩溃恢复</text><text x="101" y="596" font-family="PingFang SC" font-size="14" fill="#bfd0e2">processing 且 locked_at 超时的记录可被重新领取，避免 Worker 中途退出造成永久卡死</text>
</svg>
