<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs><linearGradient id="bg2" y2="1"><stop stop-color="#fbfdff"/><stop offset="1" stop-color="#eef4fb"/></linearGradient><filter id="s"><feDropShadow dy="7" stdDeviation="8" flood-opacity=".13"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker></defs>
  <rect width="1200" height="700" rx="34" fill="url(#bg2)"/><text x="55" y="68" font-family="PingFang SC" font-size="32" font-weight="700" fill="#10233f">HMAC：同一把密钥，两次独立计算</text>
  <g filter="url(#s)"><rect x="60" y="130" width="430" height="430" rx="24" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="710" y="130" width="430" height="430" rx="24" fill="#fff" stroke="#bfd0e2" stroke-width="2"/></g>
  <text x="90" y="180" font-family="PingFang SC" font-size="25" font-weight="700" fill="#1d4f91">平台 Sender</text><text x="740" y="180" font-family="PingFang SC" font-size="25" font-weight="700" fill="#177652">商户 Receiver</text>
  <g font-family="monospace" font-size="15"><rect x="95" y="215" width="360" height="54" rx="10" fill="#e8f1ff"/><text x="114" y="248" fill="#17345e">timestamp.event_id.raw_body</text><rect x="95" y="292" width="360" height="54" rx="10" fill="#fff4d8"/><text x="114" y="325" fill="#6f4b00">shared_secret</text><rect x="95" y="386" width="360" height="70" rx="12" fill="#eeeaff" stroke="#8d7bd1"/><text x="124" y="417" fill="#51419b">HMAC-SHA256</text><text x="124" y="442" fill="#51419b">→ signature A</text>
  <rect x="745" y="215" width="360" height="54" rx="10" fill="#e8f1ff"/><text x="764" y="248" fill="#17345e">收到的 timestamp/id/body</text><rect x="745" y="292" width="360" height="54" rx="10" fill="#fff4d8"/><text x="764" y="325" fill="#6f4b00">shared_secret</text><rect x="745" y="386" width="360" height="70" rx="12" fill="#e9f7f1" stroke="#58a77e"/><text x="774" y="417" fill="#176443">HMAC-SHA256</text><text x="774" y="442" fill="#176443">→ signature B</text></g>
  <path d="M285 269v18M285 346v34M935 269v18M935 346v34" stroke="#637f9e" stroke-width="4" marker-end="url(#a)"/>
  <path d="M490 350H700" stroke="#2563eb" stroke-width="5" marker-end="url(#a)"/><text x="535" y="328" font-family="PingFang SC" font-size="16" fill="#2563eb">HTTP：正文 + 签名</text>
  <rect x="438" y="500" width="324" height="98" rx="20" fill="#17283f"/><text x="476" y="538" font-family="PingFang SC" font-size="19" fill="#fff">常量时间比较 A == B</text><text x="490" y="571" font-family="PingFang SC" font-size="16" fill="#9ee4c5">相同 → 接受　不同 → 401</text>
  <text x="60" y="650" font-family="PingFang SC" font-size="17" fill="#60748c">HTTPS 负责保密；HMAC 负责真实性与完整性。Secret 从不随请求发送。</text>
</svg>
