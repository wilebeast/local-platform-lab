<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <rect width="1400" height="1400" rx="36" fill="#f7f8fa"/>
  <text x="70" y="82" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="40" font-weight="700" fill="#16181d">两条会计等式，其实是同一件事</text>
  <rect x="70" y="125" width="1260" height="120" rx="24" fill="#ffffff" stroke="#d9dde5" stroke-width="3"/>
  <text x="700" y="197" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="650" fill="#111318">资产 = 负债 + 权益</text>
  <path d="M700 260 V315" stroke="#7d8798" stroke-width="4" marker-end="url(#a)"/>
  <text x="735" y="294" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#667085">把本期利润拆开</text>
  <rect x="70" y="330" width="1260" height="120" rx="24" fill="#111827"/>
  <text x="700" y="402" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="42" font-weight="650" fill="#ffffff">资产 + 费用 = 负债 + 权益 + 收入</text>
  <text x="70" y="520" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="30" font-weight="650" fill="#16181d">账户的正常余额方向</text>
  <rect x="70" y="555" width="595" height="190" rx="26" fill="#edf4ff" stroke="#b8d2ff" stroke-width="3"/>
  <text x="367" y="612" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#1e4d8f">借方增加</text>
  <text x="367" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" fill="#172b4d">资产 · 费用</text>
  <text x="367" y="713" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#52677f">Debit-normal</text>
  <rect x="735" y="555" width="595" height="190" rx="26" fill="#fff3e8" stroke="#ffcc9a" stroke-width="3"/>
  <text x="1032" y="612" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="30" font-weight="700" fill="#9a4b00">贷方增加</text>
  <text x="1032" y="668" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="34" fill="#4c2a0a">负债 · 权益 · 收入</text>
  <text x="1032" y="713" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif" font-size="22" fill="#7a5b3d">Credit-normal</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d8798"/></marker></defs>
</svg>
