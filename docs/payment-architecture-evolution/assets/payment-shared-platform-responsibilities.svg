<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
  <title id="title">业务模块与共用平台能力的责任</title>
  <desc id="desc">收款、提现、卡授权继续拥有各自业务状态和资金操作。风险平台统一因子规则决策证据与动作，通知平台统一投递，身份权限能力提供可信上下文与授权机制。共用能力不直接修改业务库、账本或外部渠道。</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#5873a9"/></marker>
    <style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.title{font-size:35px;font-weight:700;fill:#17233c}.sub{font-size:18px;fill:#60718b}.head{font-size:25px;font-weight:700;fill:#253855}.body{font-size:21px;fill:#52617b}.small{font-size:18px;fill:#60718b}.link{fill:none;stroke:#5873a9;stroke-width:3;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="1120" rx="28" fill="#f4f7fd"/>
  <text x="50" y="65" class="title">统一能力，保留业务结果的所有权</text>
  <text x="50" y="104" class="sub">第七阶段 · 目标逻辑责任视图 · 面向业务负责人和架构设计者，不规定微服务部署数量</text>
  <rect x="50" y="150" width="400" height="196" rx="20" fill="#fff" stroke="#bbcee9" stroke-width="2"/>
  <rect x="500" y="150" width="400" height="196" rx="20" fill="#fff" stroke="#bbcee9" stroke-width="2"/>
  <rect x="950" y="150" width="400" height="196" rx="20" fill="#fff" stroke="#bbcee9" stroke-width="2"/>
  <text x="78" y="196" class="head">收款业务</text>
  <text x="78" y="243" class="body">订单 / 支付尝试 / 有效收款</text>
  <text x="78" y="289" class="body">渠道结果 / 退款生命周期</text>
  <text x="528" y="196" class="head">提现业务</text>
  <text x="528" y="243" class="body">提现单 / 资格 / 审批</text>
  <text x="528" y="289" class="body">资金预占 / 付款与入账</text>
  <text x="978" y="196" class="head">卡授权业务</text>
  <text x="978" y="243" class="body">卡状态 / 交易额度</text>
  <text x="978" y="289" class="body">可用资金 / 授权冻结</text>
  <path d="M250 346V405H1150V346" fill="none" stroke="#5873a9" stroke-width="3"/>
  <path d="M700 346V405" fill="none" stroke="#5873a9" stroke-width="3"/>
  <text x="270" y="389" class="small">各业务通过受控契约使用共用能力</text>
  <path d="M250 405V470" class="link"/><path d="M700 405V470" class="link"/><path d="M1150 405V470" class="link"/>
  <rect x="50" y="470" width="400" height="235" rx="20" fill="#eaf7f0" stroke="#afd6c2"/>
  <rect x="500" y="470" width="400" height="235" rx="20" fill="#fff3e4" stroke="#e4c8a3"/>
  <rect x="950" y="470" width="400" height="235" rx="20" fill="#f2ebfc" stroke="#d6c5ec"/>
  <text x="78" y="518" class="head">风控平台</text>
  <text x="78" y="565" class="body">Factor / CEL / Policy</text>
  <text x="78" y="607" class="body">Decision / Evidence / Actions</text>
  <text x="78" y="665" class="small">判断是否继续，不直接完成业务。</text>
  <text x="528" y="518" class="head">通知平台</text>
  <text x="528" y="565" class="body">订阅 / Schema / 签名</text>
  <text x="528" y="607" class="body">Delivery / 重试 / 结果</text>
  <text x="528" y="665" class="small">负责怎么送，不发明业务事实。</text>
  <text x="978" y="518" class="head">身份与权限能力</text>
  <text x="978" y="565" class="body">认证 / 可信调用上下文</text>
  <text x="978" y="607" class="body">权限机制 / 范围校验</text>
  <text x="978" y="665" class="small">业务仍校验资源归属及状态。</text>
  <rect x="50" y="756" width="1300" height="152" rx="20" fill="#e6efff" stroke="#bbcee9"/>
  <text x="78" y="800" class="head">账本、渠道与数据提供方，各自继续维护自己的权威事实和执行约束</text>
  <text x="78" y="847" class="body">风控 pass ≠ 已经预占余额；不在名单 ≠ 有资源权限；通知成功 ≠ 业务状态可以改变。</text>
  <text x="78" y="885" class="small">平台通过明确接口申请能力，不能绕过模块直接更新余额、订单或渠道操作。</text>
  <rect x="50" y="960" width="1300" height="105" rx="18" fill="#263c6d"/>
  <text x="78" y="1002" style="font-size:23px;font-weight:700;fill:#fff">复用依据是语义与契约能够统一，而不是都返回 bool，或者代码看起来相似。</text>
  <text x="78" y="1041" style="font-size:19px;fill:#dce6fc">先收敛稳定机制，再按治理、发布与容量需要决定是否成为独立服务。</text>
</svg>
