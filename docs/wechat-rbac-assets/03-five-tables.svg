<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="30" fill="#0b1220"/><text x="60" y="64" fill="#f8fafc" font-family="Arial, PingFang SC" font-size="34" font-weight="700">五张表如何组成 RBAC 授权链</text>
  <defs><marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#94a3b8"/></marker></defs>
  <g font-family="Arial, PingFang SC">
    <g transform="translate(55 170)"><rect width="210" height="190" rx="18" fill="#172554" stroke="#60a5fa" stroke-width="3"/><text x="20" y="38" fill="#bfdbfe" font-size="21" font-weight="700">rbac_members</text><text x="20" y="76" fill="white" font-size="17">id</text><text x="20" y="104" fill="white" font-size="17">organization_id</text><text x="20" y="132" fill="white" font-size="17">user_id</text><text x="20" y="160" fill="#34d399" font-size="17">status</text></g>
    <g transform="translate(315 215)"><rect width="205" height="110" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><text x="18" y="38" fill="#e2e8f0" font-size="20" font-weight="700">rbac_member_roles</text><text x="18" y="73" fill="white" font-size="17">member_id</text><text x="18" y="98" fill="white" font-size="17">role_id</text></g>
    <g transform="translate(570 170)"><rect width="205" height="190" rx="18" fill="#3b0764" stroke="#c084fc" stroke-width="3"/><text x="18" y="38" fill="#e9d5ff" font-size="21" font-weight="700">rbac_roles</text><text x="18" y="76" fill="white" font-size="17">id</text><text x="18" y="104" fill="white" font-size="17">organization_id</text><text x="18" y="132" fill="white" font-size="17">name</text><text x="18" y="160" fill="#34d399" font-size="17">status</text></g>
    <g transform="translate(825 215)"><rect width="210" height="110" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/><text x="17" y="38" fill="#e2e8f0" font-size="19" font-weight="700">rbac_role_permissions</text><text x="17" y="73" fill="white" font-size="17">role_id</text><text x="17" y="98" fill="white" font-size="17">permission_key</text></g>
    <g transform="translate(830 420)"><rect width="260" height="130" rx="18" fill="#064e3b" stroke="#34d399" stroke-width="3"/><text x="18" y="40" fill="#a7f3d0" font-size="21" font-weight="700">rbac_permissions</text><text x="18" y="80" fill="white" font-size="17">permission_key</text><text x="18" y="108" fill="white" font-size="17">description</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="4" fill="none" marker-end="url(#w)"><path d="M265 270 H315"/><path d="M520 270 H570"/><path d="M775 270 H825"/><path d="M930 325 V420"/></g>
  <g font-family="Arial, PingFang SC" font-size="17" fill="#cbd5e1" text-anchor="middle"><text x="290" y="250">N:M</text><text x="545" y="250">N:M</text><text x="800" y="250">N:M</text><text x="980" y="390">外键</text></g>
  <rect x="55" y="585" width="1035" height="48" rx="14" fill="#111827" stroke="#334155"/><text x="572" y="616" text-anchor="middle" fill="#fbbf24" font-family="Arial, PingFang SC" font-size="19">用户 → 组织成员 → 角色 → 权限点；角色不是权限，角色是权限点的集合</text>
