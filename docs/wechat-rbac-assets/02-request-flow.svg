<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" rx="30" fill="#f8fafc"/>
  <text x="60" y="65" font-family="Arial, PingFang SC" font-size="34" font-weight="700" fill="#0f172a">一次受保护请求如何完成认证与授权</text>
  <text x="60" y="102" font-family="Arial, PingFang SC" font-size="19" fill="#64748b">认证回答“你是谁”，授权回答“你能做什么”</text>
  <g font-family="Arial, PingFang SC" text-anchor="middle">
    <g><rect x="55" y="230" width="155" height="110" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="132" y="275" font-size="23" font-weight="700" fill="#1e3a8a">浏览器</text><text x="132" y="307" font-size="16" fill="#1d4ed8">Cookie / JWT</text></g>
    <g><rect x="265" y="230" width="155" height="110" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="342" y="275" font-size="23" font-weight="700" fill="#78350f">APISIX</text><text x="342" y="307" font-size="16" fill="#92400e">网关签名</text></g>
    <g><rect x="475" y="195" width="195" height="180" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="572" y="238" font-size="23" font-weight="700" fill="#4c1d95">BFF</text><text x="572" y="274" font-size="16" fill="#6d28d9">GatewayAuth</text><text x="572" y="302" font-size="16" fill="#6d28d9">Authorize</text><text x="572" y="330" font-size="16" fill="#6d28d9">绑定 profile.read</text></g>
    <g><rect x="725" y="195" width="195" height="180" rx="20" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="822" y="238" font-size="23" font-weight="700" fill="#134e4a">user-service</text><text x="822" y="274" font-size="16" fill="#0f766e">CheckPermission</text><text x="822" y="302" font-size="16" fill="#0f766e">成员 / 角色状态</text><text x="822" y="330" font-size="16" fill="#0f766e">权限集合</text></g>
    <g><rect x="975" y="230" width="170" height="110" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="1060" y="275" font-size="23" font-weight="700" fill="#14532d">PostgreSQL</text><text x="1060" y="307" font-size="16" fill="#166534">权威数据源</text></g>
  </g>
  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M210 285 H265"/><path d="M420 285 H475"/><path d="M670 285 H725"/><path d="M920 285 H975"/></g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#475569"/></marker></defs>
  <g font-family="Arial, PingFang SC" font-size="17"><path d="M920 405 H670" stroke="#16a34a" stroke-width="4" marker-end="url(#a)"/><text x="795" y="397" text-anchor="middle" fill="#166534">allowed=true / false</text><path d="M572 375 V468" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/></g>
  <g font-family="Arial, PingFang SC" text-anchor="middle"><rect x="410" y="485" width="325" height="78" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="572" y="517" font-size="20" font-weight="700" fill="#991b1b">false → HTTP 403</text><text x="572" y="545" font-size="16" fill="#b91c1c">不调用后续业务服务</text><rect x="790" y="485" width="325" height="78" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="952" y="517" font-size="20" font-weight="700" fill="#166534">true → 调用 Profile gRPC</text><text x="952" y="545" font-size="16" fill="#15803d">组装 JSON，HTTP 200</text></g>
  <path d="M735 524 H790" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/>
</svg>
