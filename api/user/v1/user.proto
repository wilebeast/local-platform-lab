syntax = "proto3";

package user.v1;

option go_package = "github.com/wilebeast/local-platform-lab/api/user/v1;userv1";

service UserService {
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc Login(LoginRequest) returns (TokenPair);
  rpc PrepareLogin(PrepareLoginRequest) returns (PrepareLoginResponse);
  rpc VerifyLogin2FA(VerifyLogin2FARequest) returns (TokenPair);
  rpc TOTPOptions(TOTPOptionsRequest) returns (TOTPOptionsResponse);
  rpc ConfirmTOTP(ConfirmTOTPRequest) returns (RecoveryCodesResponse);
  rpc UnbindTOTP(UnbindTOTPRequest) returns (UnbindTOTPResponse);
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RecoveryCodesResponse);
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (PasskeyOptionsResponse);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  rpc BeginPasskeyLogin(BeginPasskeyLoginRequest) returns (PasskeyOptionsResponse);
  rpc FinishPasskeyLogin(FinishPasskeyLoginRequest) returns (TokenPair);
  rpc Refresh(RefreshRequest) returns (TokenPair);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message GetProfileRequest {
  string user_id = 1;
}

message GetProfileResponse {
  string user_id = 1;
  string verification_status = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message PrepareLoginRequest {
  string email = 1;
  string password = 2;
}

message PrepareLoginResponse {
  bool second_factor_required = 1;
  string auth_session_token = 2;
  TokenPair token_pair = 3;
}

message VerifyLogin2FARequest {
  string auth_session_token = 1;
  string code = 2;
}

message TOTPOptionsRequest {
  string user_id = 1;
}

message TOTPOptionsResponse {
  string setup_token = 1;
  string otpauth_uri = 2;
}

message ConfirmTOTPRequest {
  string user_id = 1;
  string setup_token = 2;
  string code = 3;
}

message UnbindTOTPRequest {
  string user_id = 1;
  string password = 2;
  string code = 3;
}

message RegenerateRecoveryCodesRequest {
  string user_id = 1;
  string code = 2;
}

message RecoveryCodesResponse {
  repeated string recovery_codes = 1;
}

message UnbindTOTPResponse {
  bool unbound = 1;
}

message BeginPasskeyRegistrationRequest {
  string user_id = 1;
  string user_name = 2;
}

message PasskeyOptionsResponse {
  string ceremony_id = 1;
  bytes options_json = 2;
}

message FinishPasskeyRegistrationRequest {
  string ceremony_id = 1;
  bytes response_json = 2;
}

message FinishPasskeyRegistrationResponse {
  bool registered = 1;
  string credential_id = 2;
}

message BeginPasskeyLoginRequest {}

message FinishPasskeyLoginRequest {
  string ceremony_id = 1;
  bytes response_json = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message TokenPair {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_in = 3;
  string token_type = 4;
}

message LogoutResponse {
  bool revoked = 1;
}
