syntax = "proto3";

package account.v1;

option go_package = "github.com/wilebeast/local-platform-lab/api/account/v1;accountv1";

service AccountService {
  rpc ListAccesses(ListAccessesRequest) returns (ListAccessesResponse);
  rpc GetSummary(GetSummaryRequest) returns (GetSummaryResponse);
  rpc GetLimits(GetLimitsRequest) returns (GetLimitsResponse);
}

message ListAccessesRequest {
  string user_id = 1;
}

message AccountAccess {
  string account_id = 1;
  string account_uid = 2;
  string account_type = 3;
  string organization_id = 4;
  string member_id = 5;
  repeated string role_ids = 6;
  string relationship = 7;
}

message ListAccessesResponse {
  int64 permission_version = 1;
  repeated AccountAccess accesses = 2;
}

message GetSummaryRequest {
  string user_id = 1;
}

message GetSummaryResponse {
  string account_id = 1;
  string status = 2;
  string display_name = 3;
}

message GetLimitsRequest {
  string user_id = 1;
}

message GetLimitsResponse {
  int64 daily_limit_cents = 1;
  string currency = 2;
}
