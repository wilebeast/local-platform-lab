apiVersion: v1
kind: Service
metadata:
  name: local-alb
  namespace: local-alb
spec:
  type: NodePort
  selector:
    app: local-alb
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
    - name: https
      port: 443
      targetPort: https
      nodePort: 30443
