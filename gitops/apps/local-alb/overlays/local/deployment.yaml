apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-alb
  namespace: local-alb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-alb
  template:
    metadata:
      labels:
        app: local-alb
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: local-alb-config
        - name: tls
          secret:
            secretName: local-platform-tls
