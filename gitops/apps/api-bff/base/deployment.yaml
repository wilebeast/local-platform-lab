apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-bff
  namespace: api-bff
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-bff
  template:
    metadata:
      labels:
        app: api-bff
    spec:
      containers:
        - name: api-bff
          image: api-bff
          env:
            - name: DISCOVERY_PROVIDER
              value: nacos
            - name: GATEWAY_SIGNATURE_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-auth
                  key: gateway-signature-key
            - name: AUTH_ALLOWED_ORIGIN
              value: https://localhost:18443
          ports:
            - name: http
              containerPort: 8888
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 30m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 192Mi
