apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matching-data
  namespace: matching-service
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-service
  namespace: matching-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matching-service
  template:
    metadata:
      labels:
        app: matching-service
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
      containers:
        - name: matching-service
          image: matching-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: matching-admin
                  key: token
            - name: SNAPSHOT_PATH
              value: /data/snapshot.json
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: matching-data
---
apiVersion: v1
kind: Service
metadata:
  name: matching-service
  namespace: matching-service
spec:
  selector:
    app: matching-service
  ports:
    - name: http
      port: 8080
      targetPort: http
