apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nacos
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://git-server.git-system.svc.cluster.local/platform.git
    targetRevision: main
    path: apps/nacos/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: nacos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
